<!DOCTYPE html>
<html class="ltr-support" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Palette: Dhofar sea teal + frankincense gold on a cool slate ground. Layout: unit rail on top, tool tabs, one working canvas. */
  --bg:#eef2f5; --surface:#ffffff; --ink:#13202e; --muted:#566676; --line:#d5dee6;
  --accent:#0d7a72; --accent-ink:#ffffff; --gold:#c98a00; --gold-soft:#fbf0d4; --tint:#e3f1ef;
  --good:#1f8a4c; --good-soft:#e2f4e9; --bad:#c2410c; --bad-soft:#fde9df; --ng:#4b5ea8; --ng-soft:#e6eafa;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --arabic:"Tajawal","Segoe UI","Tahoma",sans-serif;
  --r:12px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e161e; --surface:#16212c; --ink:#e7eef4; --muted:#9fb2c2; --line:#2a3a49;
  --accent:#2bb3a6; --accent-ink:#06201d; --gold:#f0bb3a; --gold-soft:#3a2f12; --tint:#143331;
  --good:#4cc47f; --good-soft:#123222; --bad:#f08a5d; --bad-soft:#3a1d12; --ng:#93a5ef; --ng-soft:#1d2448;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e161e; --surface:#16212c; --ink:#e7eef4; --muted:#9fb2c2; --line:#2a3a49;
  --accent:#2bb3a6; --accent-ink:#06201d; --gold:#f0bb3a; --gold-soft:#3a2f12; --tint:#143331;
  --good:#4cc47f; --good-soft:#123222; --bad:#f08a5d; --bad-soft:#3a1d12; --ng:#93a5ef; --ng-soft:#1d2448;
  color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
html.big body{font-size:21px}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ar{font-family:var(--arabic);direction:rtl;text-align:right}
html.ltr-support .ar{font-family:inherit;direction:ltr;text-align:left}
html.ltr-support .mi.ar{text-align:left}
.muted{color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}

/* header */
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top{display:flex;align-items:center;gap:14px;padding:12px 0;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex:1;min-width:220px}
.brand h1{font-size:1.35rem;letter-spacing:-.01em}
.brand h1 span{color:var(--accent)}
.brand small{color:var(--muted);font-size:.85rem}
.tbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.88rem}
.tbtn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.units{display:grid;grid-template-columns:repeat(8,minmax(118px,1fr));gap:8px;overflow-x:auto;padding:0 0 12px;scrollbar-width:thin}
.unit{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 10px;text-align:left}
.unit span{line-height:1.2}
.unit b{font-family:var(--display);font-size:.78rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.unit span{font-size:.92rem;font-weight:700}
.unit[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.unit[aria-current="true"] b{color:inherit;opacity:.85}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-top:1px solid var(--line)}
nav.tabs button{border:0;background:none;padding:10px 14px;border-bottom:3px solid transparent;white-space:nowrap;font-weight:700;color:var(--muted)}
nav.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--gold)}

/* scoreboard */
#scoreboard{background:var(--ink);color:var(--surface)}
#scoreboard .wrap{display:flex;gap:10px;align-items:center;padding:8px 18px;flex-wrap:wrap}
.team{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border-radius:999px;padding:3px 6px 3px 12px}
.team input{width:92px;background:transparent;border:0;color:inherit;font-weight:700}
.team .pts{font-family:var(--display);font-size:1.25rem;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.team button{border:0;border-radius:50%;width:28px;height:28px;background:rgba(255,255,255,.16);color:inherit;font-weight:700}
.team.turn{box-shadow:0 0 0 2px var(--gold)}
#scoreboard .tbtn{background:transparent;color:inherit;border-color:rgba(255,255,255,.35)}
@media (max-width:700px){header{position:static}.team input{width:70px}}

main{padding:22px 0 60px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head h2{font-size:1.75rem}
.head .ar{font-size:1.05rem;color:var(--muted)}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.sub button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;font-weight:700}
.sub button[aria-current="true"]{background:var(--tint);border-color:var(--accent);color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:9px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1d1400}
.btn.small{padding:5px 11px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700;background:var(--tint);color:var(--accent)}

/* teacher note */
.tnote{border:1px solid var(--gold);background:var(--gold-soft);border-radius:var(--r);margin-bottom:14px}
.tnote summary{cursor:pointer;padding:8px 16px;font-weight:700;font-size:.92rem;list-style:none;color:var(--ink)}
.tnote summary::-webkit-details-marker{display:none}
.tnote summary::before{content:"▾ ";}
.tnote:not([open]) summary::before{content:"▸ ";}
.tnote .tbody{padding:0 18px 12px;font-size:.95rem;line-height:1.6}
.tnote .tbody ol,.tnote .tbody ul{margin:4px 0;padding-left:20px}

/* guide */
.guide h3{font-size:1.1rem;margin-bottom:6px}
.guide .ar p{margin:0}
.plan{width:100%;border-collapse:collapse;direction:ltr;text-align:left}
.plan td,.plan th{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
.plan th{color:var(--muted);font-weight:700}
.plan td:first-child{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700}

/* flashcards */
.flash-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.flash{width:min(620px,100%);min-height:280px;perspective:1200px;cursor:pointer;border:0;background:none;padding:0}
.flash-inner{position:relative;width:100%;min-height:280px;transition:transform .5s;transform-style:preserve-3d}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;border:1px solid var(--line)}
.face.front{background:var(--surface)}
.face.front .word{font-family:var(--display);font-size:3rem;letter-spacing:-.01em}
.face.back{background:var(--tint);transform:rotateY(180deg);gap:8px}
.face.back .def{font-size:1.25rem;font-weight:700}
.face.back .ex{font-style:italic}
.face.back .arw{font-family:var(--arabic);font-size:1.3rem;color:var(--accent)}
.meter{height:8px;width:min(620px,100%);background:var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);transition:width .3s}
table.list{width:100%;border-collapse:collapse}
table.list th,table.list td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.list th{font-size:.82rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tblwrap{overflow-x:auto}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:8px}
.mi{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;font-weight:700}
.mi.ar{text-align:right}
.mi.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.mi.done{background:var(--good-soft);border-color:var(--good);color:var(--good);cursor:default}
.mi.wrong{animation:shake .35s;border-color:var(--bad);background:var(--bad-soft)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.qline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.qline input{border:1px solid var(--line);border-radius:8px;padding:6px 10px;width:150px;background:var(--bg)}
.ok{color:var(--good);font-weight:700}.no{color:var(--bad);font-weight:700}
input.ok{border-color:var(--good)!important;background:var(--good-soft)!important}
input.no{border-color:var(--bad)!important;background:var(--bad-soft)!important}

/* jeopardy */
.jboard{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:8px;overflow-x:auto}
.jcat{background:var(--ink);color:var(--surface);border-radius:10px;padding:10px;text-align:center;font-family:var(--display);font-weight:700;min-height:58px;display:flex;align-items:center;justify-content:center}
.jcell{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;font-family:var(--display);font-size:1.7rem;font-weight:800;min-height:74px}
.jcell.used{background:var(--line);color:var(--muted);cursor:default}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,18,26,.66);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .box{background:var(--surface);border-radius:18px;max-width:760px;width:100%;padding:26px;max-height:92vh;overflow:auto}
.modal .q{font-size:1.6rem;font-weight:700;margin:12px 0 18px}
.modal .a{font-size:1.4rem;color:var(--good);font-weight:700;margin-bottom:14px}

/* timer */
.timer{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-variant-numeric:tabular-nums}
.timer .t{font-size:1.6rem;font-weight:800;min-width:4ch}
.timer.low .t{color:var(--bad)}

/* wheel */
.wheel-area{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:20px;align-items:start}
@media (max-width:760px){.wheel-area{grid-template-columns:1fr}}
.wheel-box{position:relative}
.wheel-box canvas{width:100%;height:auto;display:block}
.pointer{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:28px solid var(--gold)}
.cue{border:2px dashed var(--accent);border-radius:14px;padding:18px}
.cue h4{font-size:1.2rem;margin-bottom:6px}
.cue ul{margin:6px 0}

/* big card games */
.bigcard{text-align:center;padding:30px 20px}
.bigcard .w{font-family:var(--display);font-size:2.6rem;font-weight:800}
.taboo-list{list-style:none;padding:0;margin:14px 0;display:flex;flex-direction:column;gap:6px}
.taboo-list li{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:6px;font-weight:700;text-decoration:line-through}

/* crossword */
.cw-area{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:start}
@media (max-width:860px){.cw-area{grid-template-columns:1fr}}
.cw-scroll{overflow-x:auto}
.cw{display:grid;gap:2px;width:max-content}
.cw .c{width:34px;height:34px;position:relative}
.cw .c.on{background:var(--surface);border:1px solid var(--ink)}
.cw .c input{width:100%;height:100%;border:0;text-align:center;font-weight:800;font-size:1.05rem;text-transform:uppercase;background:transparent;padding:0}
.cw .c sup{position:absolute;top:1px;left:2px;font-size:.6rem;color:var(--muted);pointer-events:none}
.cw .c.ok{background:var(--good-soft)}.cw .c.no{background:var(--bad-soft)}
.clues h4{margin:8px 0 4px}
.clues ol{padding-left:0;margin:0;list-style:none}
.clues li{padding:3px 0}
.clues li b{color:var(--accent);margin-right:6px}

/* word search */
.ws{display:grid;gap:3px;width:max-content;user-select:none}
.ws button{width:34px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-weight:800;padding:0}
.ws button.start{background:var(--gold-soft);border-color:var(--gold)}
.ws button.found{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.wlist{display:flex;flex-wrap:wrap;gap:6px}
.wlist span{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-weight:700;font-size:.9rem}
.wlist span.found{text-decoration:line-through;color:var(--muted);background:var(--tint)}

/* scramble */
.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.tile{width:48px;height:52px;border-radius:10px;border:1px solid var(--line);background:var(--gold-soft);font-family:var(--display);font-size:1.5rem;font-weight:800}
.tile:disabled{opacity:.25}
.answer-line{min-height:56px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;font-family:var(--display);font-size:1.8rem;font-weight:800;letter-spacing:.12em;border-bottom:3px solid var(--accent);padding:4px 12px;margin:0 auto;width:fit-content;min-width:200px}

/* reading */
.reading{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:start}
@media (max-width:900px){.reading{grid-template-columns:1fr}}
.passage p{margin:0 0 12px;max-width:68ch}
.passage p b{color:var(--muted);font-family:var(--display);margin-right:6px}
.tf{padding:10px 0;border-bottom:1px solid var(--line)}
.tf .opts{display:flex;gap:6px;margin-top:6px}
.tf .opts label{border:1px solid var(--line);border-radius:8px;padding:3px 12px;cursor:pointer;font-weight:700}
.tf .opts input{position:absolute;opacity:0;pointer-events:none}
.tf .opts label:has(input:checked){background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tf .opts label:has(input:focus-visible){outline:3px solid var(--gold)}
.fb{font-size:.92rem;margin-top:6px}
.badge{display:inline-block;border-radius:6px;padding:0 8px;font-weight:800;font-size:.85rem}
.badge.T{background:var(--good-soft);color:var(--good)}.badge.F{background:var(--bad-soft);color:var(--bad)}.badge.NG{background:var(--ng-soft);color:var(--ng)}
.scorebig{font-family:var(--display);font-size:2rem;font-weight:800;color:var(--accent)}

/* grammar doctor */
.gd{padding:14px 0;border-bottom:1px solid var(--line)}
.gd .tokens{display:flex;flex-wrap:wrap;gap:4px;font-size:1.2rem}
.gd .tok{border:1px solid transparent;background:none;border-radius:6px;padding:2px 5px}
.gd .tok:hover{border-color:var(--line);background:var(--bg)}
.gd .tok.hit{background:var(--good-soft);color:var(--good);font-weight:800}
.gd .tok.miss{background:var(--bad-soft);color:var(--bad)}
.gd .fix{margin-top:8px}

/* writing */
.chart svg{width:100%;height:auto}
textarea{width:100%;min-height:260px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg);line-height:1.6}
.wc{font-variant-numeric:tabular-nums;font-weight:700}
.phr{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px}
.phr button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px}
.phr button small{display:block;color:var(--muted)}
.check label{display:flex;gap:8px;align-items:flex-start;padding:4px 0}
.plan4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.plan4 textarea{min-height:90px}

/* progress */
.prog td,.prog th{text-align:center!important}
.prog td:first-child,.prog th:first-child{text-align:left!important}
.cellp{display:inline-block;min-width:52px;border-radius:6px;padding:2px 6px;font-weight:700;font-variant-numeric:tabular-nums}
.p-hi{background:var(--good-soft);color:var(--good)}.p-mid{background:var(--gold-soft);color:var(--gold)}.p-lo{background:var(--bad-soft);color:var(--bad)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:999px;z-index:60;font-weight:700}
footer{color:var(--muted);font-size:.85rem;padding:20px 0 40px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{header,#scoreboard,.tnote,.sub,.btn,footer{display:none!important}body{background:#fff}}

/* larger game display for the projector */
.present-btn{margin-left:auto}
.jcat{font-size:1.15rem;min-height:70px}
.jcell{font-size:2.3rem;min-height:92px}
.modal .box{max-width:980px}
.modal .q{font-size:2.2rem;line-height:1.3}
.modal .a{font-size:2rem}
.modal .timer .t{font-size:2.4rem}
.bigcard .w{font-size:3.6rem}
.gclue{font-size:2.3rem;margin:18px 0;line-height:1.3}
.bigcard .timer .t{font-size:2.6rem}
.bigcard .btn{font-size:1.15rem;padding:12px 22px}
.taboo-list li{font-size:1.5rem;padding:8px}
.cw .c{width:42px;height:42px}
.cw .c input{font-size:1.3rem}
.cw .c sup{font-size:.7rem}
.clues{font-size:1.12rem}
.ws button{width:42px;height:42px;font-size:1.15rem}
.wlist span{font-size:1.1rem;padding:4px 12px}
.tile{width:64px;height:70px;font-size:2.1rem}
.answer-line{font-size:2.6rem;min-height:72px}
.whoclues{font-size:1.6rem!important;line-height:1.5}
.whoclues li{margin:10px 0!important}
.cue h4{font-size:1.6rem}
.cue{font-size:1.2rem}
.wheel-out h3{font-size:2rem!important;line-height:1.3}
.wheel-out .timer .t{font-size:2.4rem}
#exit-present{position:fixed;bottom:14px;right:14px;z-index:40;box-shadow:0 4px 14px rgba(0,0,0,.25)}
html.present .top,html.present .units,html.present nav.tabs,html.present .tnote,html.present .head,html.present footer,html.present .sub button:not(.present-btn){display:none!important}
html.present .present-btn{display:none}
html.present header{position:static;border:0}
html.present main{max-width:none;padding:16px 28px 30px}
html.present body{font-size:20px}
html.present .jcell{min-height:110px;font-size:2.8rem}
html.present .jcat{font-size:1.35rem}
html.present .cw .c{width:48px;height:48px}
html.present .ws button{width:48px;height:48px;font-size:1.3rem}
html.present .sub{margin:0}

/* ---- v3 additions ---- */
:root{--violet:#6d28d9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--violet:#c4b5fd}}
:root[data-theme="dark"]{--violet:#c4b5fd}
.author{color:var(--violet);font-weight:800}
.small{font-size:.88rem}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.howto{background:var(--tint);border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px;margin-bottom:12px}
.howto ol{margin:6px 0 0;padding-left:22px}
.howto li{margin:2px 0}
/* reorder matching */
.mgrid{display:grid;grid-template-columns:minmax(150px,1fr) minmax(220px,1.6fr);gap:8px;align-items:stretch}
.mleft{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:700;background:var(--surface)}
.mitem{display:flex;align-items:center;gap:10px;border:1px dashed var(--accent);border-radius:10px;padding:8px 10px;background:var(--bg);cursor:grab}
.mitem.dragging{opacity:.45}
.mitem.over{box-shadow:0 0 0 3px var(--gold)}
.mitem .grip{color:var(--muted);font-weight:800;letter-spacing:-2px}
.mitem .mtext{flex:1}
.mitem .arrows{display:flex;gap:4px}

      start=el("button",{class:"btn small",type:"button"},"Start"),reset=el("button",{class:"btn small ghost",type:"button"},"Reset");

    id=setInterval(function(){left--;fmt();if(left<=0){stop();if(onEnd) onEnd();}},1000);}
